    <script>
        // 設定 Marked.js 將單次換行轉譯為 <br>
        marked.use({ breaks: true });

        // ================= 1. 全局變數與基礎工具 =================
        let globalParsedData = []; 
        let totalFloors = 0;
        let renderIndex = 0; 
        const BATCH_SIZE = 30;
        let currentContentSize = 16;
        let currentReasoningSize = 14;
        let dynamicStyleTag = null;
        let searchKeyword = '';
        let searchTarget = 'all';
        let searchResults = [];
        let currentSearchFloorIndex = -1;
        let currentMarkIndex = 0;

        function getModelName(item) {
            if (!item || item.is_user) return '';
            const swipeId = item.swipe_id ?? 0;
            if (item.swipe_info && item.swipe_info[swipeId]) {
                const sw = item.swipe_info[swipeId];
                if (sw.model) return sw.model;
                if (sw.extra?.model) return sw.extra.model;
                if (sw.gen_metadata?.model) return sw.gen_metadata.model;
            }
            if (item.extra?.swipes_info && item.extra.swipes_info[swipeId]) {
                const sw = item.extra.swipes_info[swipeId];
                if (sw.model) return sw.model;
                if (sw.extra?.model) return sw.extra.model;
            }
            if (item.extra?.model) return item.extra.model;
            if (item.extra?.api_model) return item.extra.api_model;
            if (item.extra?.model_name) return item.extra.model_name;
            if (item.gen_metadata?.model) return item.gen_metadata.model;
            if (item.gen_metadata?.model_name) return item.gen_metadata.model_name;
            if (item.extra?.gen_metadata?.model) return item.extra.gen_metadata.model;
            if (item.model) return item.model;
            if (item.model_name) return item.model_name;
            return '';
        }

        function highlightText(html, keyword) {
            if (!keyword) return html;
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = html;
            const walker = document.createTreeWalker(tempDiv, NodeFilter.SHOW_TEXT, null, false);
            let nodesToReplace = [];
            let node;
            while(node = walker.nextNode()) {
                if (node.nodeValue.includes(keyword) && node.parentNode.nodeName !== 'MARK') {
                    if (searchTarget === 'mes') {
                        let parent = node.parentNode;
                        let inDetails = false;
                        while (parent && parent !== tempDiv) {
                            if (parent.nodeName === 'DETAILS') { inDetails = true; break; }
                            parent = parent.parentNode;
                        }
                        if (inDetails) continue;
                    }
                    nodesToReplace.push(node);
                }
            }
            nodesToReplace.forEach(n => {
                const parts = n.nodeValue.split(keyword);
                const escapedParts = parts.map(p => {
                    const tmp = document.createElement('div');
                    tmp.textContent = p;
                    return tmp.innerHTML;
                });
                const span = document.createElement('span');
                span.innerHTML = escapedParts.join(`<mark class="search-highlight">${keyword}</mark>`);
                n.parentNode.replaceChild(span, n);
            });
            return tempDiv.innerHTML;
        }

        function performSearch() {
            const kw = document.getElementById('searchInput').value.trim();
            const target = document.getElementById('searchTarget').value;
            searchKeyword = kw;
            searchTarget = target;
            searchResults = [];
            currentSearchFloorIndex = -1;
            currentMarkIndex = 0;

            if (!kw) {
                updateSearchInfo();
                renderOutput();
                return;
            }

            const chatOnlyData = globalParsedData.filter(item => item.mes !== undefined && item.mes !== null);
            chatOnlyData.forEach(item => {
                let mesText = item.mes; 
                let reasoningContent = item.extra?.reasoning || item.reasoning || '';
                const thinkingMatch = mesText.match(/<thinking>([\s\S]*?)<\/thinking>/i);
                if (thinkingMatch) { 
                    reasoningContent = thinkingMatch[1].trim() + (reasoningContent ? '\n\n' + reasoningContent : ''); 
                    mesText = mesText.replace(/<thinking>[\s\S]*?<\/thinking>/i, '').trim(); 
                }
                
                let match = false;
                if (target === 'all' || target === 'mes') {
                    let tempDiv = document.createElement('div');
                    tempDiv.innerHTML = processCustomTags(mesText);
                    if (target === 'mes') {
                        tempDiv.querySelectorAll('details').forEach(d => d.remove());
                    }
                    if (tempDiv.textContent.includes(kw)) match = true;
                }
                if (target === 'all' || target === 'reasoning') {
                    if (reasoningContent.includes(kw)) match = true;
                }
                if (match) searchResults.push(item._local_id);
            });
            
            if (searchResults.length > 0) {
                currentSearchFloorIndex = 0;
                renderOutput();
                scrollToSearchMatch();
            } else {
                updateSearchInfo();
                renderOutput();
            }
        }

        function scrollToCurrentMark() {
            if (currentSearchFloorIndex < 0 || currentSearchFloorIndex >= searchResults.length) return;
            const targetId = searchResults[currentSearchFloorIndex];
            const floorEl = document.getElementById('floor-' + targetId);
            if (!floorEl) return;
            
            const marks = floorEl.querySelectorAll('mark.search-highlight');
            if (marks.length === 0) {
                window.scrollTo({top: floorEl.getBoundingClientRect().top + window.scrollY - 65, behavior: 'smooth'});
                return;
            }

            if (currentMarkIndex === -1) currentMarkIndex = marks.length - 1;
            if (currentMarkIndex >= marks.length) currentMarkIndex = 0;
            
            document.querySelectorAll('mark.search-highlight.active-match').forEach(m => m.classList.remove('active-match'));
            
            const targetMark = marks[currentMarkIndex];
            targetMark.classList.add('active-match');

            // 自動展開所有父層的 <details>，確保隱藏內容（如舊對話或思考鏈）能被 scrollIntoView 定位
            let parent = targetMark.parentElement;
            while (parent && parent !== floorEl) {
                if (parent.tagName === 'DETAILS') {
                    parent.open = true;
                }
                parent = parent.parentElement;
            }

            targetMark.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function scrollToSearchMatch() {
            if (currentSearchFloorIndex < 0 || currentSearchFloorIndex >= searchResults.length) return;
            updateSearchInfo();
            const targetId = searchResults[currentSearchFloorIndex];
            const chatOnlyData = globalParsedData.filter(item => item.mes !== undefined && item.mes !== null);
            let targetIndex = chatOnlyData.findIndex(item => item._local_id === targetId);
            if (targetIndex === -1) return; 
            if (targetIndex >= renderIndex) renderBatch(targetIndex - renderIndex + 1);
            
            setTimeout(() => {
                const floorEl = document.getElementById('floor-' + targetId);
                if (floorEl) {
                    scrollToCurrentMark();
                }
            }, 100);
        }

        function updateSearchInfo() {
            const info = document.getElementById('searchInfo');
            if (!searchKeyword) {
                info.textContent = '0 / 0';
            } else {
                info.textContent = searchResults.length > 0 ? `樓層: ${currentSearchFloorIndex + 1} / ${searchResults.length}` : '0 / 0';
            }
        }

        const defaultPackage = {
            "預設美化包": [
                { ruleName: "📊 Profile", findRegex: "<profile>([\\s\\S]*?)<\\/profile>", replaceString: "<details class='special-block'><summary>📊 Profile</summary><div class='special-content'>$1</div></details>" },
                { ruleName: "📻 Meow FM", findRegex: "<meow_FM>([\\s\\S]*?)<\\/meow_FM>", replaceString: "<details class='special-block'><summary>📻 Meow FM</summary><div class='special-content'>$1</div></details>" }
            ]
        };

        function injectDynamicCSS(cssText) {
            if (!dynamicStyleTag) {
                dynamicStyleTag = document.createElement('style');
                dynamicStyleTag.id = 'st-dynamic-injected-css';
                document.head.appendChild(dynamicStyleTag);
            }
            if (!dynamicStyleTag.textContent.includes(cssText.substring(0, 30))) {
                dynamicStyleTag.textContent += "\n" + cssText;
            }
        }

        function downloadJSONL(dataArray, filename) {
            const lines = dataArray.map(item => JSON.stringify(item)).join('\n');
            const blob = new Blob([lines], { type: 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = filename; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
        }

        function updateFontSize(type, delta) {
            if (type === 'content') {
                currentContentSize += delta;
                if (currentContentSize < 12) currentContentSize = 12;
                if (currentContentSize > 32) currentContentSize = 32;
                document.documentElement.style.setProperty('--content-font-size', currentContentSize + 'px');
                document.getElementById('valContentSize').textContent = currentContentSize + 'px';
            } else if (type === 'reasoning') {
                currentReasoningSize += delta;
                if (currentReasoningSize < 10) currentReasoningSize = 10;
                if (currentReasoningSize > 24) currentReasoningSize = 24;
                document.documentElement.style.setProperty('--reasoning-font-size', currentReasoningSize + 'px');
                document.getElementById('valReasoningSize').textContent = currentReasoningSize + 'px';
            }
        }

        // ================= 2. 雙層正則與腳本管理引擎 (v3) =================
        const SCRIPT_STORAGE_KEY_V3 = 'st_script_engine_v3';
        let currentFileName = '';
        let scriptEngineData = {
            version: 3,
            globalPresets: {
                "預設美化組": {
                    enabled: true,
                    rules: [
                        {
                            id: "rule_g_1",
                            name: "📊 Profile",
                            enabled: true,
                            findRegex: "<profile>([\\s\\S]*?)<\\/profile>",
                            replaceString: "<details class='special-block profile-block'><summary>📊 Profile</summary><div class='special-content'>$1</div></details>",
                            customCss: ".profile-block { border-left: 3px solid #3b82f6; }"
                        },
                        {
                            id: "rule_g_2",
                            name: "📻 Meow FM",
                            enabled: true,
                            findRegex: "<meow_FM>([\\s\\S]*?)<\\/meow_FM>",
                            replaceString: "<details class='special-block fm-block'><summary>📻 Meow FM</summary><div class='special-content'>$1</div></details>",
                            customCss: ""
                        }
                    ]
                }
            },
            fileScopedPresets: {}
        };

        function generateUniqueId(prefix = 'rule') {
            return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 5);
        }

        function loadScriptEngineData() {
            const rawV3 = localStorage.getItem(SCRIPT_STORAGE_KEY_V3);
            if (rawV3) {
                try {
                    scriptEngineData = JSON.parse(rawV3);
                    if (!scriptEngineData.globalPresets) scriptEngineData.globalPresets = {};
                    if (!scriptEngineData.fileScopedPresets) scriptEngineData.fileScopedPresets = {};
                } catch(e) {}
            } else {
                // 舊版 v2 平滑遷移
                const rawV2 = localStorage.getItem('st_package_presets_v2');
                if (rawV2) {
                    try {
                        const legacy = JSON.parse(rawV2);
                        scriptEngineData.globalPresets = {};
                        Object.keys(legacy).forEach(pkgName => {
                            scriptEngineData.globalPresets[pkgName] = {
                                enabled: true,
                                rules: legacy[pkgName].map(r => ({
                                    id: generateUniqueId('rule_g'),
                                    name: r.ruleName || '未命名條目',
                                    enabled: true,
                                    findRegex: r.findRegex || '',
                                    replaceString: r.replaceString || '',
                                    customCss: ''
                                }))
                            };
                        });
                    } catch(e){}
                }
                saveScriptEngineData();
            }
            renderScriptEngineUI();
            injectAllRuleStyles();
        }

        function saveScriptEngineData() {
            localStorage.setItem(SCRIPT_STORAGE_KEY_V3, JSON.stringify(scriptEngineData));
            injectAllRuleStyles();
        }

        function injectAllRuleStyles() {
            let aggregatedCss = '';
            // 收集全域啟用規則 CSS
            if (scriptEngineData.globalPresets) {
                Object.values(scriptEngineData.globalPresets).forEach(group => {
                    if (group.enabled && Array.isArray(group.rules)) {
                        group.rules.forEach(r => {
                            if (r.enabled && r.customCss) aggregatedCss += '\n' + r.customCss;
                        });
                    }
                });
            }
            // 收集當前檔案啟用規則 CSS
            if (currentFileName && scriptEngineData.fileScopedPresets?.[currentFileName]?.enabled) {
                const fGroups = scriptEngineData.fileScopedPresets[currentFileName].groups;
                if (fGroups) {
                    Object.values(fGroups).forEach(group => {
                        if (group.enabled && Array.isArray(group.rules)) {
                            group.rules.forEach(r => {
                                if (r.enabled && r.customCss) aggregatedCss += '\n' + r.customCss;
                            });
                        }
                    });
                }
            }

            if (!dynamicStyleTag) {
                dynamicStyleTag = document.createElement('style');
                dynamicStyleTag.id = 'st-dynamic-injected-css';
                document.head.appendChild(dynamicStyleTag);
            }
            dynamicStyleTag.textContent = aggregatedCss;
        }

        function renderScriptEngineUI() {
            renderGlobalGroupsUI();
            renderFileGroupsUI();
        }

        function renderGlobalGroupsUI() {
            const container = document.getElementById('globalGroupsContainer');
            if (!container) return;
            container.innerHTML = '';

            const groups = scriptEngineData.globalPresets || {};
            const groupNames = Object.keys(groups);
            if (groupNames.length === 0) {
                container.innerHTML = '<div style="font-size:0.8em; color:var(--meta-color); padding:4px;">尚無全域分組，點擊 ➕ 分組 建立</div>';
                return;
            }

            groupNames.forEach(gName => {
                const group = groups[gName];
                const card = createGroupCardDOM('global', gName, group);
                container.appendChild(card);
            });
        }

        function renderFileGroupsUI() {
            const container = document.getElementById('fileGroupsContainer');
            const nameBadge = document.getElementById('fileScopeNameDisplay');
            if (!container) return;
            container.innerHTML = '';

            if (!currentFileName) {
                if (nameBadge) nameBadge.style.display = 'none';
                container.innerHTML = '<div style="font-size:0.8em; color:var(--meta-color); padding:4px;">載入 .jsonl 檔案後將自動關聯專屬腳本</div>';
                return;
            }

            if (nameBadge) {
                nameBadge.style.display = 'inline-block';
                nameBadge.textContent = '📄 ' + currentFileName;
                nameBadge.title = currentFileName;
            }

            const fileScope = scriptEngineData.fileScopedPresets[currentFileName];
            if (!fileScope || !fileScope.groups || Object.keys(fileScope.groups).length === 0) {
                container.innerHTML = '<div style="font-size:0.8em; color:var(--meta-color); padding:4px;">此檔案尚無專屬分組，可點擊上方 ➕ 分組 或 📋 複製</div>';
                return;
            }

            Object.keys(fileScope.groups).forEach(gName => {
                const group = fileScope.groups[gName];
                const card = createGroupCardDOM('file', gName, group);
                container.appendChild(card);
            });
        }

        function createGroupCardDOM(layer, groupName, groupData) {
            const card = document.createElement('div');
            card.className = 'script-group-card';

            const rules = groupData.rules || [];
            const header = document.createElement('div');
            header.className = 'script-group-header';

            header.innerHTML = `
                <span class="group-toggle-icon" style="font-size:0.75em; color:var(--meta-color); cursor:pointer;">▼</span>
                <span class="script-group-title" title="${groupName}">
                    ${groupName}
                    <span class="script-group-count">(${rules.length})</span>
                </span>
                <div class="script-group-actions" onclick="event.stopPropagation()">
                    <button class="btn-rule-action btn-add-rule" title="新增條目至此分組">➕</button>
                    <button class="btn-rule-action btn-rename-group" title="重新命名分組">✎</button>
                    <button class="btn-rule-action btn-delete-group" style="color:var(--danger-color);" title="刪除此分組">🗑</button>
                    <label class="toggle-switch" title="切換分組全開/全關">
                        <input type="checkbox" class="group-enable-switch" ${groupData.enabled !== false ? 'checked' : ''}>
                        <span class="toggle-slider"></span>
                    </label>
                </div>
            `;

            const body = document.createElement('div');
            body.className = 'script-group-body';

            rules.forEach(rule => {
                const itemEl = document.createElement('div');
                itemEl.className = 'script-rule-item';
                itemEl.innerHTML = `
                    <label class="toggle-switch" title="啟用/停用此條目" onclick="event.stopPropagation()">
                        <input type="checkbox" class="rule-enable-switch" ${rule.enabled !== false ? 'checked' : ''}>
                        <span class="toggle-slider"></span>
                    </label>
                    <span class="script-rule-name" title="${rule.name}">${rule.name}</span>
                    <div class="script-rule-actions">
                        <button class="btn-rule-action btn-edit-rule" title="編輯條目">✎</button>
                        <button class="btn-rule-action btn-delete-rule" style="color:var(--danger-color);" title="刪除條目">🗑</button>
                    </div>
                `;

                // 條目開關
                const ruleSwitch = itemEl.querySelector('.rule-enable-switch');
                ruleSwitch.addEventListener('change', () => {
                    rule.enabled = ruleSwitch.checked;
                    saveScriptEngineData();
                    if (globalParsedData.length) renderOutput();
                });

                // 編輯條目
                itemEl.querySelector('.btn-edit-rule').addEventListener('click', (e) => {
                    e.stopPropagation();
                    openEditRuleModal(layer, groupName, rule.id);
                });

                // 刪除條目
                itemEl.querySelector('.btn-delete-rule').addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (!confirm(`確定要刪除條目「${rule.name}」嗎？`)) return;
                    groupData.rules = groupData.rules.filter(r => r.id !== rule.id);
                    saveScriptEngineData();
                    renderScriptEngineUI();
                    if (globalParsedData.length) renderOutput();
                });

                body.appendChild(itemEl);
            });

            // 點擊 Header 折疊展開
            header.addEventListener('click', (e) => {
                if (e.target.closest('.script-group-actions')) return;
                body.classList.toggle('collapsed');
                const icon = header.querySelector('.group-toggle-icon');
                icon.textContent = body.classList.contains('collapsed') ? '▶' : '▼';
            });

            // 分組總開關
            const groupSwitch = header.querySelector('.group-enable-switch');
            groupSwitch.addEventListener('change', () => {
                groupData.enabled = groupSwitch.checked;
                saveScriptEngineData();
                if (globalParsedData.length) renderOutput();
            });

            // 新增條目按鈕
            header.querySelector('.btn-add-rule').addEventListener('click', () => {
                openEditRuleModal(layer, groupName, null);
            });

            // 重新命名分組
            header.querySelector('.btn-rename-group').addEventListener('click', () => {
                const newName = prompt('請輸入新的分組名稱：', groupName);
                if (!newName || newName.trim() === groupName) return;
                const trimmed = newName.trim();
                const parentObj = layer === 'global' ? scriptEngineData.globalPresets : scriptEngineData.fileScopedPresets[currentFileName].groups;
                if (parentObj[trimmed]) return alert('此分組名稱已存在！');
                parentObj[trimmed] = groupData;
                delete parentObj[groupName];
                saveScriptEngineData();
                renderScriptEngineUI();
            });

            // 刪除分組
            header.querySelector('.btn-delete-group').addEventListener('click', () => {
                if (!confirm(`確定要刪除整個分組「${groupName}」及其底下的 ${rules.length} 條規則嗎？`)) return;
                const parentObj = layer === 'global' ? scriptEngineData.globalPresets : scriptEngineData.fileScopedPresets[currentFileName].groups;
                delete parentObj[groupName];
                saveScriptEngineData();
                renderScriptEngineUI();
                if (globalParsedData.length) renderOutput();
            });

            card.appendChild(header);
            card.appendChild(body);
            return card;
        }

        // ================= 編輯條目彈窗邏輯 =================
        function openEditRuleModal(layer, groupName, ruleId) {
            document.getElementById('modalTargetLayer').value = layer;
            document.getElementById('modalTargetGroup').value = groupName;
            document.getElementById('modalTargetRuleId').value = ruleId || '';

            const titleEl = document.getElementById('editModalTitle');
            const nameInput = document.getElementById('modalRuleName');
            const findRegexInput = document.getElementById('modalFindRegex');
            const replaceStringInput = document.getElementById('modalReplaceString');
            const customCssInput = document.getElementById('modalCustomCss');
            const enabledInput = document.getElementById('modalRuleEnabled');

            if (ruleId) {
                titleEl.textContent = '✏️ 編輯正則條目';
                const parentObj = layer === 'global' ? scriptEngineData.globalPresets : scriptEngineData.fileScopedPresets[currentFileName]?.groups;
                const group = parentObj?.[groupName];
                const rule = group?.rules.find(r => r.id === ruleId);
                if (rule) {
                    nameInput.value = rule.name || '';
                    findRegexInput.value = rule.findRegex || '';
                    replaceStringInput.value = rule.replaceString || '';
                    customCssInput.value = rule.customCss || '';
                    enabledInput.checked = rule.enabled !== false;
                }
            } else {
                titleEl.textContent = '➕ 新增正則條目';
                nameInput.value = '';
                findRegexInput.value = '';
                replaceStringInput.value = '';
                customCssInput.value = '';
                enabledInput.checked = true;
            }

            document.getElementById('editRuleModal').classList.remove('hidden');
            nameInput.focus();
        }

        function closeEditRuleModal() {
            document.getElementById('editRuleModal').classList.add('hidden');
        }

        function saveEditRuleModal() {
            const layer = document.getElementById('modalTargetLayer').value;
            const groupName = document.getElementById('modalTargetGroup').value;
            const ruleId = document.getElementById('modalTargetRuleId').value;

            const name = document.getElementById('modalRuleName').value.trim();
            const findRegex = document.getElementById('modalFindRegex').value.trim();
            const replaceString = document.getElementById('modalReplaceString').value;
            const customCss = document.getElementById('modalCustomCss').value.trim();
            const enabled = document.getElementById('modalRuleEnabled').checked;

            if (!name) return alert('請填寫條目名稱！');
            if (!findRegex) return alert('請填寫尋找正則！');

            try {
                let patternStr = findRegex;
                let flags = 'gmi';
                if (patternStr.startsWith('/') && patternStr.lastIndexOf('/') > 0) {
                    const lastSlash = patternStr.lastIndexOf('/');
                    flags = patternStr.substring(lastSlash + 1);
                    patternStr = patternStr.substring(1, lastSlash);
                }
                new RegExp(patternStr, flags);
            } catch (err) {
                return alert('正則表達式語法有誤：\n' + err.message);
            }

            const parentObj = layer === 'global' ? scriptEngineData.globalPresets : scriptEngineData.fileScopedPresets[currentFileName]?.groups;
            if (!parentObj || !parentObj[groupName]) return alert('找不到目標分組！');

            const group = parentObj[groupName];
            if (!Array.isArray(group.rules)) group.rules = [];

            if (ruleId) {
                const rule = group.rules.find(r => r.id === ruleId);
                if (rule) {
                    rule.name = name;
                    rule.findRegex = findRegex;
                    rule.replaceString = replaceString;
                    rule.customCss = customCss;
                    rule.enabled = enabled;
                }
            } else {
                group.rules.push({
                    id: generateUniqueId(layer === 'global' ? 'rule_g' : 'rule_f'),
                    name: name,
                    enabled: enabled,
                    findRegex: findRegex,
                    replaceString: replaceString,
                    customCss: customCss
                });
            }

            saveScriptEngineData();
            renderScriptEngineUI();
            closeEditRuleModal();
            if (globalParsedData.length) renderOutput();
        }

        // ================= 複製檔案設定彈窗邏輯 =================
        function openCloneProfileModal() {
            if (!currentFileName) return alert('請先載入一份 .jsonl 檔案！');
            const select = document.getElementById('cloneSourceSelect');
            select.innerHTML = '';

            const allFiles = Object.keys(scriptEngineData.fileScopedPresets || {}).filter(f => f !== currentFileName);
            if (allFiles.length === 0) {
                return alert('目前雲端或本地尚無其他檔案的設定可供複製！');
            }

            allFiles.forEach(f => {
                const opt = document.createElement('option');
                opt.value = f;
                const gCount = Object.keys(scriptEngineData.fileScopedPresets[f].groups || {}).length;
                opt.textContent = `${f} (${gCount} 個分組)`;
                select.appendChild(opt);
            });

            document.getElementById('cloneProfileModal').classList.remove('hidden');
        }

        function closeCloneProfileModal() {
            document.getElementById('cloneProfileModal').classList.add('hidden');
        }

        function confirmCloneProfile() {
            const select = document.getElementById('cloneSourceSelect');
            const srcFile = select.value;
            if (!srcFile || !scriptEngineData.fileScopedPresets[srcFile]) return;

            if (scriptEngineData.fileScopedPresets[currentFileName]?.groups && Object.keys(scriptEngineData.fileScopedPresets[currentFileName].groups).length > 0) {
                if (!confirm(`複製將會覆蓋當前檔案「${currentFileName}」的專屬腳本，確定要繼續嗎？`)) return;
            }

            const srcGroups = scriptEngineData.fileScopedPresets[srcFile].groups || {};
            const clonedGroups = JSON.parse(JSON.stringify(srcGroups));
            Object.values(clonedGroups).forEach(group => {
                if (Array.isArray(group.rules)) {
                    group.rules.forEach(r => r.id = generateUniqueId('rule_f'));
                }
            });

            if (!scriptEngineData.fileScopedPresets[currentFileName]) {
                scriptEngineData.fileScopedPresets[currentFileName] = { enabled: true, groups: {} };
            }
            scriptEngineData.fileScopedPresets[currentFileName].groups = clonedGroups;

            saveScriptEngineData();
            renderScriptEngineUI();
            closeCloneProfileModal();
            if (globalParsedData.length) renderOutput();
            alert(`🎉 成功從「${srcFile}」複製設定至當前檔案！`);
        }

        // ================= 3. 核心生命週期與事件初始化 =================
        document.addEventListener('DOMContentLoaded', () => {
            loadScriptEngineData();
            
            // 綁定夜間/明亮模式
            document.getElementById('themeSelect').addEventListener('change', (e) => {
                if (e.target.value === 'dark') document.body.classList.add('dark-theme');
                else document.body.classList.remove('dark-theme');
            });

            // 綁定縮放字級
            document.getElementById('btnContentMinus').addEventListener('click', () => updateFontSize('content', -1));
            document.getElementById('btnContentPlus').addEventListener('click', () => updateFontSize('content', 1));
            document.getElementById('btnReasoningMinus').addEventListener('click', () => updateFontSize('reasoning', -1));
            document.getElementById('btnReasoningPlus').addEventListener('click', () => updateFontSize('reasoning', 1));

            // 展開與收合摺疊標籤
            document.getElementById('btnExpandAll').addEventListener('click', () => { document.querySelectorAll('details').forEach(el => el.open = true); });
            document.getElementById('btnCollapseAll').addEventListener('click', () => { document.querySelectorAll('details').forEach(el => el.open = false); });

            // 雙層腳本按鈕事件
            document.getElementById('btnAddGlobalGroup').addEventListener('click', () => {
                const name = prompt('請輸入全域分組名稱：', '新全域分組');
                if (!name || !name.trim()) return;
                const trimmed = name.trim();
                if (scriptEngineData.globalPresets[trimmed]) return alert('此分組名稱已存在！');
                scriptEngineData.globalPresets[trimmed] = { enabled: true, rules: [] };
                saveScriptEngineData();
                renderScriptEngineUI();
            });

            document.getElementById('btnAddFileGroup').addEventListener('click', () => {
                if (!currentFileName) return alert('請先載入 .jsonl 檔案！');
                const name = prompt('請輸入檔案專屬分組名稱：', '新專屬分組');
                if (!name || !name.trim()) return;
                const trimmed = name.trim();
                if (!scriptEngineData.fileScopedPresets[currentFileName]) {
                    scriptEngineData.fileScopedPresets[currentFileName] = { enabled: true, groups: {} };
                }
                if (scriptEngineData.fileScopedPresets[currentFileName].groups[trimmed]) return alert('此分組名稱已存在！');
                scriptEngineData.fileScopedPresets[currentFileName].groups[trimmed] = { enabled: true, rules: [] };
                saveScriptEngineData();
                renderScriptEngineUI();
            });

            document.getElementById('btnCloneFileProfile').addEventListener('click', openCloneProfileModal);

            // 彈窗按鈕事件
            document.getElementById('btnModalClose').addEventListener('click', closeEditRuleModal);
            document.getElementById('btnModalCancel').addEventListener('click', closeEditRuleModal);
            document.getElementById('btnModalSave').addEventListener('click', saveEditRuleModal);

            document.getElementById('btnCloneModalClose').addEventListener('click', closeCloneProfileModal);
            document.getElementById('btnCloneCancel').addEventListener('click', closeCloneProfileModal);
            document.getElementById('btnCloneConfirm').addEventListener('click', confirmCloneProfile);

            // 匯入與匯出 JSON
            document.getElementById('btnExportPreset').addEventListener('click', () => {
                const str = JSON.stringify(scriptEngineData, null, 2);
                const blob = new Blob([str], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `st_script_presets_v3_${Date.now()}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            });

            document.getElementById('regexFileInput').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if (parsed.version === 3 || parsed.globalPresets || parsed.fileScopedPresets) {
                            scriptEngineData = parsed;
                        } else {
                            // 舊版匯入支援
                            scriptEngineData.globalPresets = {};
                            Object.keys(parsed).forEach(pkgName => {
                                scriptEngineData.globalPresets[pkgName] = {
                                    enabled: true,
                                    rules: parsed[pkgName].map(r => ({
                                        id: generateUniqueId('rule_g'),
                                        name: r.ruleName || '未命名條目',
                                        enabled: true,
                                        findRegex: r.findRegex || '',
                                        replaceString: r.replaceString || '',
                                        customCss: ''
                                    }))
                                };
                            });
                        }
                        saveScriptEngineData();
                        renderScriptEngineUI();
                        if (globalParsedData.length) renderOutput();
                        alert('🎉 成功匯入腳本設定！');
                    } catch(err) {
                        alert('匯入失敗：JSON 格式有誤！');
                    }
                    e.target.value = '';
                };
                reader.readAsText(file);
            });

            // ================= Google Drive 雲端同步 =================
            const GOOGLE_CLIENT_ID = "15417722990-5j3m65biqhtf999f9ll7mvdd8dhhi3ee.apps.googleusercontent.com";
            const GDRIVE_FILE_NAME = 'st_character_presets.json';
            const GDRIVE_SCOPES = 'https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/userinfo.profile';

            let gdriveTokenClient = null;
            let gdriveAccessToken = null;
            let gdriveFileId = null;

            function initGDriveGIS() {
                if (typeof google === 'undefined' || !google.accounts) {
                    setTimeout(initGDriveGIS, 300);
                    return;
                }

                try {
                    gdriveTokenClient = google.accounts.oauth2.initTokenClient({
                        client_id: GOOGLE_CLIENT_ID,
                        scope: GDRIVE_SCOPES,
                        callback: handleGDriveTokenResponse
                    });
                } catch(e) {
                    console.error('GIS Init error:', e);
                }
            }

            document.getElementById('btnGDriveConnect').addEventListener('click', () => {
                if (!gdriveTokenClient) initGDriveGIS();
                if (gdriveTokenClient) {
                    gdriveTokenClient.requestAccessToken({ prompt: 'consent' });
                } else {
                    alert('Google Identity 服務載入中，請稍候再試。');
                }
            });

            document.getElementById('btnGDriveLogout').addEventListener('click', () => {
                if (gdriveAccessToken && typeof google !== 'undefined' && google.accounts) {
                    google.accounts.oauth2.revoke(gdriveAccessToken, () => {
                        gdriveAccessToken = null;
                        gdriveFileId = null;
                        updateGDriveUI(false);
                    });
                } else {
                    gdriveAccessToken = null;
                    gdriveFileId = null;
                    updateGDriveUI(false);
                }
            });

            async function handleGDriveTokenResponse(resp) {
                if (resp.error) return alert('Google 授權失敗：' + resp.error);
                gdriveAccessToken = resp.access_token;
                updateGDriveUI(true);

                try {
                    const res = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                        headers: { 'Authorization': `Bearer ${gdriveAccessToken}` }
                    });
                    if (res.ok) {
                        const user = await res.json();
                        if (user.picture) {
                            const img = document.getElementById('gdriveUserAvatar');
                            img.src = user.picture;
                            img.style.display = 'inline-block';
                        }
                        if (user.name) {
                            document.getElementById('gdriveUserName').textContent = user.name;
                        }
                    }
                } catch(e){}

                await findGDriveFile();
            }

            function updateGDriveUI(isAuthed) {
                document.getElementById('gdriveLoggedOut').style.display = isAuthed ? 'none' : 'block';
                document.getElementById('gdriveLoggedIn').style.display = isAuthed ? 'block' : 'none';
            }

            async function findGDriveFile() {
                if (!gdriveAccessToken) return;
                try {
                    const q = encodeURIComponent(`name = '${GDRIVE_FILE_NAME}' and trashed = false`);
                    const res = await fetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id,name,modifiedTime)`, {
                        headers: { 'Authorization': `Bearer ${gdriveAccessToken}` }
                    });
                    if (res.ok) {
                        const data = await res.json();
                        if (data.files && data.files.length > 0) {
                            gdriveFileId = data.files[0].id;
                        } else {
                            gdriveFileId = null;
                        }
                    }
                } catch(e) {
                    console.error('查詢 Drive 檔案失敗:', e);
                }
            }

            document.getElementById('btnGDriveFetch').addEventListener('click', async () => {
                if (!gdriveAccessToken) return alert('請先連線 Google 雲端硬碟！');
                await findGDriveFile();
                if (!gdriveFileId) return alert('Google 雲端硬碟中尚未有備份檔案！請先點擊「上傳」建立雲端檔案。');

                try {
                    const res = await fetch(`https://www.googleapis.com/drive/v3/files/${gdriveFileId}?alt=media`, {
                        headers: { 'Authorization': `Bearer ${gdriveAccessToken}` }
                    });
                    if (!res.ok) throw new Error(await res.text());
                    const cloudData = await res.json();
                    
                    if (cloudData.version === 3 || cloudData.globalPresets || cloudData.fileScopedPresets) {
                        scriptEngineData = cloudData;
                    } else {
                        // 舊版格式自動轉換
                        scriptEngineData.globalPresets = {};
                        Object.keys(cloudData).forEach(pkgName => {
                            scriptEngineData.globalPresets[pkgName] = {
                                enabled: true,
                                rules: cloudData[pkgName].map(r => ({
                                    id: generateUniqueId('rule_g'),
                                    name: r.ruleName || '未命名條目',
                                    enabled: true,
                                    findRegex: r.findRegex || '',
                                    replaceString: r.replaceString || '',
                                    customCss: ''
                                }))
                            };
                        });
                    }
                    saveScriptEngineData();
                    renderScriptEngineUI();
                    if (globalParsedData.length) renderOutput();
                    alert('🎉 成功從您的 Google Drive 載入最新腳本與樣式！');
                } catch(err) {
                    console.error(err);
                    alert('下載失敗：' + err.message);
                }
            });

            document.getElementById('btnGDrivePush').addEventListener('click', async () => {
                if (!gdriveAccessToken) return alert('請先連線 Google 雲端硬碟！');
                const contentString = JSON.stringify(scriptEngineData, null, 2);

                try {
                    await findGDriveFile();
                    if (gdriveFileId) {
                        const res = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${gdriveFileId}?uploadType=media`, {
                            method: 'PATCH',
                            headers: {
                                'Authorization': `Bearer ${gdriveAccessToken}`,
                                'Content-Type': 'application/json'
                            },
                            body: contentString
                        });
                        if (!res.ok) throw new Error(await res.text());
                    } else {
                        const metadata = { name: GDRIVE_FILE_NAME, parents: ['appDataFolder'] };
                        const boundary = '-------314159265358979323846';
                        const delimiter = "\r\n--" + boundary + "\r\n";
                        const close_delim = "\r\n--" + boundary + "--";
                        const multipartBody = delimiter + 'Content-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(metadata) + delimiter + 'Content-Type: application/json\r\n\r\n' + contentString + close_delim;

                        const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${gdriveAccessToken}`,
                                'Content-Type': `multipart/related; boundary=${boundary}`
                            },
                            body: multipartBody
                        });
                        if (!res.ok) throw new Error(await res.text());
                        const data = await res.json();
                        gdriveFileId = data.id;
                    }
                    alert('✅ 全部全域與檔案專屬腳本已成功上傳保存至個人 Google Drive！');
                } catch(err) {
                    console.error(err);
                    alert('上傳失敗：' + err.message);
                }
            });

            initGDriveGIS();

            // 依螢幕寬度初始化側邊面板 (電腦版預設展開，手機版預設收合)
            const floatingPanel = document.getElementById('floatingPanel');
            const panelToggleBtn = document.getElementById('panelToggleBtn');
            if (window.innerWidth <= 700) {
                floatingPanel.classList.add('collapsed');
                panelToggleBtn.textContent = '◀';
            } else {
                floatingPanel.classList.remove('collapsed');
                panelToggleBtn.textContent = '▶';
            }

            // 面板收合按鈕 (電腦版左側箭頭)
            panelToggleBtn.addEventListener('click', () => {
                floatingPanel.classList.toggle('collapsed');
                if (floatingPanel.classList.contains('collapsed')) {
                    panelToggleBtn.textContent = '◀';
                } else {
                    panelToggleBtn.textContent = '▶';
                }
            });

            // 手機版頂端選單按鈕
            document.getElementById('btnMobileMenu').addEventListener('click', () => {
                floatingPanel.classList.toggle('collapsed');
            });

            // 搜尋列相關事件
            document.getElementById('btnGlobalSearch').addEventListener('click', () => { document.getElementById('searchBar').classList.add('active'); document.getElementById('searchInput').focus(); });
            document.getElementById('btnDesktopSearch').addEventListener('click', () => { document.getElementById('searchBar').classList.add('active'); document.getElementById('searchInput').focus(); });
            document.getElementById('btnSearchClose').addEventListener('click', () => { 
                document.getElementById('searchBar').classList.remove('active'); 
                document.getElementById('searchInput').value = '';
                searchKeyword = ''; searchResults = [];
                renderOutput();
            });
            document.getElementById('searchInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') performSearch();
            });
            document.getElementById('searchTarget').addEventListener('change', () => {
                if (document.getElementById('searchInput').value) performSearch();
            });
            document.getElementById('btnSearchPrev').addEventListener('click', () => {
                if (searchResults.length === 0) return;
                const targetId = searchResults[currentSearchFloorIndex];
                const floorEl = document.getElementById('floor-' + targetId);
                if (floorEl) {
                    const marks = floorEl.querySelectorAll('mark.search-highlight');
                    if (currentMarkIndex > 0) {
                        currentMarkIndex--;
                        scrollToCurrentMark();
                        return;
                    }
                }
                currentSearchFloorIndex = (currentSearchFloorIndex - 1 + searchResults.length) % searchResults.length;
                currentMarkIndex = -1;
                scrollToSearchMatch();
            });
            document.getElementById('btnSearchNext').addEventListener('click', () => {
                if (searchResults.length === 0) return;
                const targetId = searchResults[currentSearchFloorIndex];
                const floorEl = document.getElementById('floor-' + targetId);
                if (floorEl) {
                    const marks = floorEl.querySelectorAll('mark.search-highlight');
                    if (currentMarkIndex < marks.length - 1) {
                        currentMarkIndex++;
                        scrollToCurrentMark();
                        return;
                    }
                }
                currentSearchFloorIndex = (currentSearchFloorIndex + 1) % searchResults.length;
                currentMarkIndex = 0;
                scrollToSearchMatch();
            });

            // 啟動滾動加載偵測器
            observer.observe(document.getElementById('scrollSentinel'));
        });

        // 檔案載入與解析
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0]; if (!file) return;
            
            currentFileName = file.name;
            const label = document.getElementById('fileNameDisplay');
            label.textContent = '📄 ' + file.name;
            label.title = file.name;

            // 初始化或關聯該檔案專屬空間
            if (!scriptEngineData.fileScopedPresets[currentFileName]) {
                scriptEngineData.fileScopedPresets[currentFileName] = {
                    enabled: true,
                    groups: {
                        "默認分組": {
                            enabled: true,
                            rules: []
                        }
                    }
                };
                saveScriptEngineData();
            }
            renderScriptEngineUI();
            injectAllRuleStyles();

            const reader = new FileReader();
            reader.onload = function(event) {
                globalParsedData = [];
                event.target.result.split('\n').forEach(line => {
                    if (line.trim()) { try { globalParsedData.push(JSON.parse(line)); } catch(err){} }
                });
                globalParsedData.sort((a, b) => {
                    if (!a.send_date) return -1; if (!b.send_date) return 1;
                    return new Date(a.send_date) - new Date(b.send_date);
                });
                let local_seq = 0; let current_original_seq = 0;
                globalParsedData.forEach(item => {
                    if (item.mes !== undefined && item.mes !== null) {
                        item._local_id = local_seq;
                        if (item._original_id !== undefined && item._original_id !== null) { current_original_seq = item._original_id; }
                        else { if (local_seq > 0) current_original_seq++; item._original_id = current_original_seq; }
                        local_seq++;
                    }
                });
                totalFloors = globalParsedData.filter(item => item.mes !== undefined && item.mes !== null).length;
                renderOutput();
            };
            reader.readAsText(file);
        });

        // 匯出修改後的檔案
        document.getElementById('btnExport').addEventListener('click', () => {
            if (!globalParsedData.length) return alert('沒有可匯出的資料！');
            let baseName = document.getElementById('fileNameDisplay').textContent.replace('📄 ', '');
            if (baseName === '點此載入檔案') baseName = 'chat'; if (baseName.includes('.')) baseName = baseName.substring(0, baseName.lastIndexOf('.'));
            const now = new Date(); const pad = n => n.toString().padStart(2, '0'); const ts = `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
            downloadJSONL(globalParsedData, `${baseName}_edited_${ts}.jsonl`);
        });

        // ================= 4. 正則標籤與 Markdown 轉譯 =================
        function processCustomTags(text) {
            if (!text) return text;

            // 1. 套用全域啟用規則
            if (scriptEngineData.globalPresets) {
                Object.values(scriptEngineData.globalPresets).forEach(group => {
                    if (group.enabled !== false && Array.isArray(group.rules)) {
                        group.rules.forEach(rule => {
                            if (rule.enabled !== false && rule.findRegex) {
                                text = applySingleRule(text, rule);
                            }
                        });
                    }
                });
            }

            // 2. 套用當前檔案區域啟用規則
            if (currentFileName && scriptEngineData.fileScopedPresets?.[currentFileName]?.enabled !== false) {
                const fGroups = scriptEngineData.fileScopedPresets[currentFileName].groups;
                if (fGroups) {
                    Object.values(fGroups).forEach(group => {
                        if (group.enabled !== false && Array.isArray(group.rules)) {
                            group.rules.forEach(rule => {
                                if (rule.enabled !== false && rule.findRegex) {
                                    text = applySingleRule(text, rule);
                                }
                            });
                        }
                    });
                }
            }

            // 3. 標準 details 折疊標籤相容
            text = text.replace(/<details[^>]*>([\s\S]*?)<\/details>/gi, function(match, innerContent) {
                if (match.includes('class="sra"')) return match; 
                let summary = '詳細資訊'; let content = innerContent;
                const summaryMatch = innerContent.match(/<summary[^>]*>([\s\S]*?)<\/summary>/i);
                if (summaryMatch) { summary = summaryMatch[1]; content = innerContent.replace(/<summary[^>]*>([\s\S]*?)<\/summary>/i, ''); }
                return `<details class="special-block"><summary>${summary}</summary><div class="special-content">${marked.parse(content)}</div></details>`;
            });

            text = marked.parse(text);
            
            if (text.includes('class="language-mermaid"')) {
                text = text.replace(/<pre><code class="language-mermaid">([\s\S]*?)<\/code><\/pre>/g, '<div class="mermaid">$1</div>');
            }
            return text;
        }

        function applySingleRule(text, rule) {
            try {
                let patternStr = rule.findRegex;
                let flags = 'gmi';
                if (patternStr.startsWith('/') && patternStr.lastIndexOf('/') > 0) {
                    const lastSlash = patternStr.lastIndexOf('/');
                    flags = patternStr.substring(lastSlash + 1);
                    patternStr = patternStr.substring(1, lastSlash);
                }
                const rx = new RegExp(patternStr, flags);
                text = text.replace(rx, function(...args) {
                    let template = rule.replaceString || '';
                    const styleMatch = template.match(/<style[^>]*>([\s\S]*?)<\/style>/i);
                    if (styleMatch) { injectDynamicCSS(styleMatch[1]); template = template.replace(/<style[^>]*>([\s\S]*?)<\/style>/i, ''); }
                    template = template.replace(/<\/?(html|head|body|meta)[^>]*>/gi, '');
                    for (let i = 1; i < args.length - 2; i++) {
                        const val = args[i] !== undefined ? args[i] : '';
                        const cleanedVal = marked.parse(val).replace(/^<p>|<\/p>$/g, '').trim();
                        template = template.replace(new RegExp('\\$' + i, 'g'), cleanedVal);
                    }
                    return template;
                });
            } catch(e) {}
            return text;
        }

        function startEdit(index, messageDiv, contentDiv, actionsDiv, btnEdit) {
            contentDiv.style.display = 'none'; btnEdit.style.display = 'none';
            const textarea = document.createElement('textarea'); textarea.className = 'edit-textarea'; textarea.value = globalParsedData[index].mes;
            const btnSave = document.createElement('button'); btnSave.innerHTML = '✔ 儲存'; btnSave.style.color = '#28a745';
            const btnCancel = document.createElement('button'); btnCancel.innerHTML = '✘ 取消'; btnCancel.style.color = '#dc3545';
            btnSave.onclick = () => {
                const newVal = textarea.value; globalParsedData[index].mes = newVal;
                if (Array.isArray(globalParsedData[index].swipes) && globalParsedData[index].swipe_id !== undefined) {
                    globalParsedData[index].swipes[globalParsedData[index].swipe_id] = newVal;
                }
                contentDiv.innerHTML = processCustomTags(newVal); cleanup();
            };
            btnCancel.onclick = () => cleanup();
            function cleanup() { textarea.remove(); btnSave.remove(); btnCancel.remove(); contentDiv.style.display = 'block'; btnEdit.style.display = 'flex'; }
            actionsDiv.appendChild(btnSave); actionsDiv.appendChild(btnCancel); messageDiv.appendChild(textarea);
        }

        // ================= 5. 分頁渲染與自動導覽定位 =================
        const observer = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting && globalParsedData.length > 0) renderBatch(BATCH_SIZE);
        }, { rootMargin: '200px' });

        function renderOutput() {
            document.getElementById('output').innerHTML = ''; renderIndex = 0;
            const sentinel = document.getElementById('scrollSentinel');
            sentinel.textContent = '向下捲動以載入更多...'; renderBatch(BATCH_SIZE);
        }

        function renderBatch(count) {
            if (renderIndex >= totalFloors) return;
            const outputDiv = document.getElementById('output'); const showReasoning = document.getElementById('toggleReasoning').checked;
            const chatOnlyData = globalParsedData.filter(item => item.mes !== undefined && item.mes !== null);
            let endIndex = Math.min(renderIndex + count, totalFloors);
            
            for (let i = renderIndex; i < endIndex; i++) {
                const item = chatOnlyData[i]; const localId = item._local_id; const originalId = item._original_id; 
                let mesText = item.mes; let reasoningContent = item.extra?.reasoning || item.reasoning || '';
                const thinkingMatch = mesText.match(/<thinking>([\s\S]*?)<\/thinking>/i);
                if (thinkingMatch) { reasoningContent = thinkingMatch[1].trim() + (reasoningContent ? '\n\n' + reasoningContent : ''); mesText = mesText.replace(/<thinking>[\s\S]*?<\/thinking>/i, '').trim(); }

                const div = document.createElement('div'); div.className = 'message';
                if (item.is_user) div.classList.add('user-msg'); else div.classList.add('char-msg');
                if (item.is_system) div.classList.add('system-msg');
                div.id = 'floor-' + localId; div.setAttribute('data-local-id', localId); div.setAttribute('data-floor', localId); 

                const dateObj = new Date(item.send_date); const timeString = isNaN(dateObj) ? item.send_date : dateObj.toLocaleString('zh-TW', { hour12: false });
                const meta = document.createElement('div'); meta.className = 'meta'; const sysTag = item.is_system ? ' [系統]' : '';
                const modelName = getModelName(item);
                const modelTag = modelName ? `<span class="model-tag" title="生成模型: ${modelName}">🤖 ${modelName}</span>` : '';
                
                // --- 重構區塊以實現 Flexbox 排版 ---
                const idsDiv = document.createElement('div'); idsDiv.className = 'meta-ids';
                idsDiv.innerHTML = `<span class="floor-id" style="border-top-right-radius:0; border-bottom-right-radius:0; margin-right:0;">酒館: #${localId}</span><span class="floor-id" style="background:#6b7280; border-top-left-radius:0; border-bottom-left-radius:0; margin-left:0;">總計: #${originalId}</span>`;
                
                const nameTimeDiv = document.createElement('div'); nameTimeDiv.className = 'meta-name-time';
                nameTimeDiv.innerHTML = `[${timeString}] ${item.name || '未知'}${sysTag}${modelTag}`;
                
                const actionsDiv = document.createElement('div'); actionsDiv.className = 'msg-actions';
                const btnEdit = document.createElement('button'); btnEdit.innerHTML = '✎'; btnEdit.title = '編輯';
                actionsDiv.appendChild(btnEdit); 
                
                meta.appendChild(idsDiv);
                meta.appendChild(nameTimeDiv);
                meta.appendChild(actionsDiv);
                // ------------------------------------

                div.appendChild(meta);

                if (showReasoning && reasoningContent && reasoningContent.trim()) {
                    let finalReasoning = reasoningContent;
                    if (searchKeyword && (searchTarget === 'all' || searchTarget === 'reasoning')) {
                        finalReasoning = highlightText(finalReasoning, searchKeyword);
                    }
                    const reasoningBox = document.createElement('details'); reasoningBox.className = 'reasoning-box';
                    reasoningBox.innerHTML = `<summary class="reasoning-title">🧠 思考鏈 - 點擊展開</summary><div class="reasoning-content">${finalReasoning}</div>`;
                    div.appendChild(reasoningBox);
                }

                const content = document.createElement('div'); content.className = 'content';
                let finalMesText = processCustomTags(mesText);
                if (searchKeyword && (searchTarget === 'all' || searchTarget === 'mes')) {
                    finalMesText = highlightText(finalMesText, searchKeyword);
                }
                content.innerHTML = finalMesText; div.appendChild(content);
                const realIndex = globalParsedData.indexOf(item); btnEdit.onclick = () => startEdit(realIndex, div, content, actionsDiv, btnEdit);
                outputDiv.appendChild(div);
            }
            renderIndex = endIndex;
            if (renderIndex >= totalFloors) { document.getElementById('scrollSentinel').textContent = '已載入全部對話'; }
        }

        function getVisibleFloor() {
            const floors = document.querySelectorAll('.message'); if (!floors.length) return 0;
            let closestLocalId = parseInt(floors[0].getAttribute('data-local-id'));
            let minDiff = Infinity; const targetOffset = 75; 
            for (let i = 0; i < floors.length; i++) {
                const rect = floors[i].getBoundingClientRect(); const diff = Math.abs(rect.top - targetOffset);
                if (diff < minDiff) { minDiff = diff; closestLocalId = parseInt(floors[i].getAttribute('data-local-id')); }
            }
            return closestLocalId;
        }
        
        function scrollToFloor(num) {
            const chatOnlyData = globalParsedData.filter(item => item.mes !== undefined && item.mes !== null);
            let targetIndex = chatOnlyData.findIndex(item => item._local_id === num);
            if (targetIndex === -1) targetIndex = chatOnlyData.findIndex(item => item._original_id === num);
            if (targetIndex === -1) return; 
            if (targetIndex >= renderIndex) renderBatch(targetIndex - renderIndex + 1);
            setTimeout(() => {
                const targetItem = chatOnlyData[targetIndex]; const el = document.getElementById('floor-' + targetItem._local_id);
                if (el) { window.scrollTo({top: el.getBoundingClientRect().top + window.scrollY - 65, behavior: 'smooth'}); document.getElementById('jumpInput').value = num; }
            }, 50);
        }
        
        /* 電腦版面板跳轉綁定 */
        document.getElementById('btnPrev').addEventListener('click', () => { const c = getVisibleFloor(); const chatOnlyData = globalParsedData.filter(item => item.mes !== undefined && item.mes !== null); const currentIndex = chatOnlyData.findIndex(item => item._local_id === c); if (currentIndex > 0) scrollToFloor(chatOnlyData[currentIndex - 1]._local_id); });
        document.getElementById('btnNext').addEventListener('click', () => { const c = getVisibleFloor(); const chatOnlyData = globalParsedData.filter(item => item.mes !== undefined && item.mes !== null); const currentIndex = chatOnlyData.findIndex(item => item._local_id === c); if (currentIndex !== -1 && currentIndex < chatOnlyData.length - 1) scrollToFloor(chatOnlyData[currentIndex + 1]._local_id); });
        document.getElementById('btnTop').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
        document.getElementById('btnBottom').addEventListener('click', () => { if (renderIndex < totalFloors) renderBatch(totalFloors - renderIndex); setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 100); });
        document.getElementById('btnJump').addEventListener('click', () => scrollToFloor(parseInt(document.getElementById('jumpInput').value)));

        /* 手機版頂端跳轉綁定 */
        document.getElementById('btnMobilePrev').addEventListener('click', () => { const c = getVisibleFloor(); const chatOnlyData = globalParsedData.filter(item => item.mes !== undefined && item.mes !== null); const currentIndex = chatOnlyData.findIndex(item => item._local_id === c); if (currentIndex > 0) scrollToFloor(chatOnlyData[currentIndex - 1]._local_id); });
        document.getElementById('btnMobileNext').addEventListener('click', () => { const c = getVisibleFloor(); const chatOnlyData = globalParsedData.filter(item => item.mes !== undefined && item.mes !== null); const currentIndex = chatOnlyData.findIndex(item => item._local_id === c); if (currentIndex !== -1 && currentIndex < chatOnlyData.length - 1) scrollToFloor(chatOnlyData[currentIndex + 1]._local_id); });

    </script>
</body>
</html>
